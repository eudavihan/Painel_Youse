<style>
/* Layout: trilho lateral de navegação + barra de filtros fixa + cartões de tabela densos (operação de call center) */
:root{

  --good:#17804a; --bad:#c2372b; --warn:#b26a00; --hl:#fbeef9;
  --f-ui:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141016; --surface:#1d171f; --surface-2:#251e28; --line:#352b38; --fg:#f1e9f2; --muted:#a898ab;
  --accent:#d65ec8; --accent-2:#8f4387; --accent-ink:#1a0f19; --muted-bar:#5d4f60;
  --good:#48c07e; --bad:#f07466; --warn:#f0b24a; --hl:#2c1f2c; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141016; --surface:#1d171f; --surface-2:#251e28; --line:#352b38; --fg:#f1e9f2; --muted:#a898ab;
  --accent:#d65ec8; --accent-2:#8f4387; --accent-ink:#1a0f19; --muted-bar:#5d4f60;
  --good:#48c07e; --bad:#f07466; --warn:#f0b24a; --hl:#2c1f2c; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand .mk{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}.brand small{color:var(--muted);font-size:11.5px}
#nav{display:flex;flex-direction:column;gap:2px}
#nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:500}
#nav a:hover{background:var(--surface-2)}
#nav a.on{background:var(--accent);color:var(--accent-ink)}
#nav a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.navsep{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:16px 10px 6px}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
#nav a.on .badge{background:var(--accent-ink);color:var(--accent)}
.sync{margin:18px 8px 0;font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted-bar);margin-top:4px;flex:none}
.sync.ok::before{background:var(--good)}.sync.err::before,.sync.slow::before{background:var(--warn)}
main{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end}
.top h1{font-size:20px;margin:0 auto 2px 0;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
.ctl{display:flex;flex-direction:column;gap:3px}
.ctl span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
select,input.txt,input[type=month],input[type=date],textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
textarea{width:100%;resize:vertical}.mono{font-family:var(--f-mono);font-size:12.5px}
#view{padding-block:18px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.exbar{margin:12px max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));background:var(--hl);border:1px dashed var(--accent);border-radius:var(--r);padding:9px 12px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile.hero{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tile.hero .tl,.tile.hero .ts{color:inherit;opacity:.85}
.tl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tv{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.ts{font-size:12px;color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:12px 14px 8px}
.card-h h2{font-size:14.5px;margin:0;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.hint{font-size:12px;color:var(--muted)}.hint.pad{padding:0 14px}
.lead{margin:0;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:12.5px;width:max-content;min-width:100%}
th,td{padding:5px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
thead th{position:sticky;top:0;background:var(--surface-2);font-weight:600;font-size:11.5px;color:var(--muted);text-align:center;vertical-align:bottom}
thead th small,th.stk small{display:block;font-weight:400;font-size:10.5px;color:var(--muted)}
th.stk{position:sticky;left:0;background:var(--surface);text-align:left;font-weight:600;z-index:1;max-width:340px;overflow:hidden;text-overflow:ellipsis}
thead th.stk{z-index:2;background:var(--surface-2)}
th.stk.sub{font-weight:400;color:var(--muted);padding-left:20px}
th.tabn{font-weight:500;max-width:420px}
td.cur,th.cur{background:color-mix(in srgb,var(--accent) 8%,transparent)}
thead th.cur{color:var(--accent)}
td.gap,th.gap{padding:0;width:10px;border-bottom:none;background:transparent}
tr.sep td{height:8px;border-bottom:none;padding:0}
tr.band td{text-align:left;font-weight:700;color:var(--accent);background:var(--surface-2);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
tr.tot th,tr.tot td{font-weight:700;border-top:2px solid var(--line);background:var(--surface-2)}
tr.sub2 th,tr.sub2 td{color:var(--muted)}
tr.hl th,tr.hl td{background:var(--hl)}
tr.hla th,tr.hla td{box-shadow:inset 0 -2px 0 var(--accent)}
tr.key th,tr.key td{font-weight:700;color:var(--accent)}
tbody tr:hover td{filter:brightness(.97)}
.pos{color:var(--good);font-weight:600}.neg{color:var(--bad);font-weight:600}
.z{color:var(--muted-bar)}
.empty{text-align:center;color:var(--muted);padding:18px}
.opn{font-weight:600}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);font-weight:500}
.chip.nov{color:var(--warn);border-color:currentColor;background:transparent}
.chip.ex{color:var(--accent);border-color:var(--accent);background:transparent}.chip.okc{color:var(--good);border-color:currentColor;background:transparent;max-width:220px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.chip.c-SUCESSO{color:var(--good)}.chip.c-RECUSA{color:var(--bad)}.chip.c-AGENDAMENTO{color:var(--warn)}.chip.c-SEM-CLASSE{color:#fff;background:var(--bad);border-color:var(--bad)}
.q{display:inline-block;min-width:30px;text-align:center;border-radius:6px;font-weight:700;font-size:11.5px;padding:1px 6px}
.q.Q1{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}.q.Q2{background:color-mix(in srgb,var(--good) 9%,transparent);color:var(--good)}
.q.Q3{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}.q.Q4{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.bar{display:inline-block;width:46px;height:6px;border-radius:3px;background:var(--surface-2);margin-right:6px;vertical-align:middle;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.chart{padding:0 14px 12px}.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--f-ui)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);padding-bottom:4px}
.lg i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.inl{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:12.5px;border:0;background:var(--surface);color:var(--fg);padding:5px 11px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg.sm button{padding:3px 9px;font-size:12px}
.btn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}.btn.sm{padding:3px 9px;font-size:12px}
.x{border:0;background:transparent;color:var(--muted);font-size:17px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:6px}.x:hover{color:var(--bad);background:var(--surface-2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px}
.toolbar .sp{flex:1}
.sticky-save{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.dirty{color:var(--warn);font-size:12.5px;font-weight:600}
table.edit td,table.edit th{text-align:left}
table.edit td.num,.num{text-align:right}
table.edit input.txt{width:100%;min-width:120px}
table.edit td.tabcell{min-width:min(420px,60vw)}
table.edit td.tabcell input{min-width:280px}
tr.rev td{background:color-mix(in srgb,var(--warn) 8%,transparent)}
.alert{background:color-mix(in srgb,var(--bad) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:var(--r);padding:10px 14px}
.ok-line{color:var(--good);padding:4px 14px 12px;margin:0}
.ups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.up{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.up.busy{opacity:.6;pointer-events:none}
.up-h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.up-h h3{margin:0;font-size:14px}
.up .hint{margin:0;min-height:32px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:var(--fg)}
.drop:hover{border-color:var(--accent);background:var(--hl)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop small{color:var(--muted);font-size:11px}
.up-f{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:4px 14px 6px}
.fields.col{grid-template-columns:1fr;padding-bottom:14px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.filas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:6px;padding:8px 14px 14px}
.fila{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;cursor:pointer;min-width:0}
.fila span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fila small{color:var(--muted);font-variant-numeric:tabular-nums}
.fila.on{border-color:var(--accent);background:var(--hl)}
.card>textarea{margin:0 14px;width:calc(100% - 28px)}.card>.hint{padding:4px 14px 12px;margin:0}
.ctl.pub{order:10}.btn.arm{background:var(--warn);border-color:var(--warn);color:#fff}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:9px;font-size:13px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:min(420px,calc(100vw - 32px));z-index:50}
.toast.show{opacity:1;transform:none}.toast.bad{background:var(--bad);color:#fff}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand{padding-bottom:8px}
  #nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}#nav a{white-space:nowrap}.navsep{display:none}.sync{margin-top:6px}
  .top,#view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top h1{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  </main>
</div>

/* ===== Núcleo de cálculo (sem DOM) ===== */
const HOURS = Array.from({length:16},(_,i)=>i+8);

function fixMoji(s){
  if(typeof s!=='string') return s==null?'':String(s);
  if(/[ÃÂ][\u0080-ÿ]/.test(s)){ try{ const b=new Uint8Array([...s].map(c=>c.charCodeAt(0)&255)); const t=new TextDecoder('utf-8',{fatal:true}).decode(b); return t; }catch(e){} }
  return s;
}
function norm(s){
  return fixMoji(s==null?'':String(s)).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim().toUpperCase();
}
const pad=n=>String(n).padStart(2,'0');
function isoDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return isoDate(d); }
function monthStart(s){ return s.slice(0,7)+'-01'; }
function monthEnd(s){ const d=parseISO(monthStart(s)); d.setMonth(d.getMonth()+1); d.setDate(0); return isoDate(d); }
function addMonths(ms,n){ const d=parseISO(ms); d.setMonth(d.getMonth()+n); return isoDate(d); }
function weekday(s){ return parseISO(s).getDay(); } // 0=dom
function daysBetween(a,b){ const out=[]; let d=a; while(d<=b){ out.push(d); d=addDays(d,1);} return out; }

/* Datas: Date, serial do Excel, "dd/mm/aa hh:mm", "dd/mm/aaaa", ISO */
function parseDateTime(v){
  if(v==null||v==='') return null;
  if(v instanceof Date && !isNaN(v)) return v;
  if(typeof v==='number'){ const ms=Math.round((v-25569)*86400000); const d=new Date(ms); return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes(),d.getUTCSeconds()); }
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return new Date(y,+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0)); }
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  return null;
}
function parseTimeOnly(v){
  if(v==null||v==='') return null;
  if(v instanceof Date) return v.getHours();
  if(typeof v==='number'){ const f=v%1; return Math.floor(f*24+1e-9); }
  const m=String(v).match(/(\d{1,2}):(\d{2})/); return m? +m[1] : null;
}
function parseDur(v){
  if(v==null||v==='') return 0;
  if(typeof v==='number') return Math.round(v*86400);
  if(v instanceof Date) return v.getHours()*3600+v.getMinutes()*60+v.getSeconds();
  const m=String(v).trim().match(/^(\d+):(\d{2}):(\d{2})/); return m? (+m[1])*3600+(+m[2])*60+(+m[3]) : 0;
}
function parseNum(v){
  if(typeof v==='number') return v;
  if(v==null) return 0;
  let s=String(v).replace(/R\$/g,'').replace(/\s/g,'');
  if(!s) return 0;
  if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')) s=s.replace(',','.');
  const n=parseFloat(s); return isNaN(n)?0:n;
}
function hourOf(d){ const h=d.getHours(); return h<8?8:h; }

/* Calendário de dias úteis */
function makeCal(feriados){
  const set=new Map((feriados||[]).map(f=>[f.d,f.n]));
  const du=s=>{ if(set.has(s)) return 0; const w=weekday(s); return w===0?0:(w===6?0.5:1); };
  const sumDU=(a,b)=>{ let t=0; for(const d of daysBetween(a,b)) t+=du(d); return t; };
  return {du,sumDU,feriado:s=>set.get(s)||''};
}

const GUID=/^[0-9a-f]{8}-[0-9a-f]{4}-/i;
function lastTab(fin){
  if(!fin) return 'NÃO TABULADO';
  const t=String(fin).split(';').map(x=>x.trim());
  for(let i=t.length-1;i>=0;i--){ const x=t[i]; if(x && !x.toUpperCase().startsWith('ININ') && !(x.length===36&&GUID.test(x))) return x; }

function parseCSV(text){
  const first=text.split(/\r?\n/,1)[0]||'';
  const cnt=c=>first.split(c).length;
  const delim=[';',',','\t'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f.replace(/\r$/,'')); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}

async function initDb(){

  let use=window.claude&&window.claude.use;
  if(!use){ await new Promise(r=>setTimeout(r,800)); use=window.claude&&window.claude.use; }
  if(!use){ setSync('local'); return; }
  let user=null; try{ user=await window.claude.use('user'); }catch(e){}
  try{ assets=await window.claude.use('assets'); }catch(e){ assets=null; }
  EDITOR = !!assets || (user? await user.canEdit() : false);
  if(!EDITOR){ setViewer(); return; }
  setEditor();
  try{ dbh=await window.claude.use('db'); }catch(e){ dbh=null; }
  if(!dbh){ setSync('local'); return; }
  dbh.doc('config/bases').onSnapshot(snap=>{ shared=snap.exists?(snap.data()||{}):{}; pullShared(); render(); },()=>{});
  setSync('loading');
  let got=0; const timer=setTimeout(()=>{ if(got<4) setSync('slow'); },10000);
  for(const [name,path] of Object.entries(DOCS)){
    let first=true;
    dbh.doc(path).onSnapshot(snap=>{
      if(snap.exists && !dirty[name]){ applyDoc(name,snap.data()); if(name==='arvore') treeDraft=null; else if(!dirty.metas&&!dirty.filtros) cfgDraft=null; recompute(); render(); }
      if(first && !snap.metadata.fromCache){ first=false; got++; if(got>=4){ clearTimeout(timer); setSync('ok'); } }
    }, err=>{ setSync('err'); });
  }
}

function monthWeeks(ms){ const me=monthEnd(ms); const out=[]; let a=ms; while(a<=me){ let b=a; while(weekday(b)!==0 && b<me) b=addDays(b,1); out.push([a,b]); a=addDays(b,1);} return out; }

function chartBars(labels,series,opt={}){
  const W=760,Hh=200,pl=36,pr=10,pt=12,pb=24, n=labels.length, iw=W-pl-pr, ih=Hh-pt-pb;
  const max=Math.max(1,...series.flatMap(s=>s.values.map(v=>v||0)),...(opt.line?opt.line.values.map(v=>v||0):[]));
  const nice=(()=>{ const p=Math.pow(10,Math.floor(Math.log10(max))); for(const m of [1,2,2.5,5,10]) if(m*p>=max) return m*p; return 10*p; })();
  const y=v=>pt+ih-(v/nice)*ih, bw=iw/n, gw=bw*0.72, sw=gw/series.length;
  let g=''; for(let k=0;k<=4;k++){ const v=nice*k/4, yy=y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" class="grid"/><text x="${pl-6}" y="${yy+3}" class="ax" text-anchor="end">${NF0.format(v)}</text>`; }
  let b=''; labels.forEach((l,i)=>{ series.forEach((s,j)=>{ const v=s.values[i]||0; const x=pl+i*bw+(bw-gw)/2+j*sw; b+=`<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${Math.max(1,sw-1).toFixed(1)}" height="${(ih-(y(v)-pt)).toFixed(1)}" fill="${s.color}" rx="1.5"><title>${esc(l)} · ${esc(s.name)}: ${NF0.format(v)}</title></rect>`; });
    if(n<=20||i%2===0) b+=`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${Hh-8}" class="ax" text-anchor="middle">${esc(l)}</text>`; });
  let ln=''; if(opt.line){ const pts=opt.line.values.map((v,i)=>`${(pl+i*bw+bw/2).toFixed(1)},${y(v||0).toFixed(1)}`); ln=`<polyline points="${pts.join(' ')}" fill="none" stroke="${opt.line.color}" stroke-width="2" stroke-dasharray="${opt.line.dash?'5 4':''}"/>`+opt.line.values.map((v,i)=>`<circle cx="${(pl+i*bw+bw/2).toFixed(1)}" cy="${y(v||0).toFixed(1)}" r="2.5" fill="${opt.line.color}"><title>${esc(labels[i])} · ${esc(opt.line.name)}: ${fN1(v)}</title></circle>`).join(''); }
  const leg=[...series.map(s=>[s.name,s.color,false]),...(opt.line?[[opt.line.name,opt.line.color,true]]:[])].map(([n,c,l])=>`<span class="lg"><i style="background:${c}${l?';height:2px':''}"></i>${esc(n)}</span>`).join('');
  return `<div class="chart"><div class="legend">${leg}</div><svg viewBox="0 0 ${W} ${Hh}" role="img">${g}${b}${ln}</svg></div>`;
}
function chartLines(labels,lines){
  const W=760,Hh=200,pl=44,pr=10,pt=12,pb=24,n=labels.length,iw=W-pl-pr,ih=Hh-pt-pb;
  const max=Math.max(1,...lines.flatMap(l=>l.values.filter(v=>v!=null)));
  const y=v=>pt+ih-(v/max)*ih, x=i=>pl+(n<=1?iw/2:i*iw/(n-1));
  let g=''; for(let k=0;k<=4;k++){ const v=max*k/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${pl-6}" y="${y(v)+3}" class="ax" text-anchor="end">${NF0.format(v)}</text>`; }
  let t=''; labels.forEach((l,i)=>{ if(n<=16||i%2===0) t+=`<text x="${x(i)}" y="${Hh-8}" class="ax" text-anchor="middle">${esc(l)}</text>`; });
  const ls=lines.map(l=>{ const pts=l.values.map((v,i)=>v==null?null:`${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean); const last=l.values.map((v,i)=>[v,i]).filter(a=>a[0]!=null).pop();
    return `<polyline points="${pts.join(' ')}" fill="none" stroke="${l.color}" stroke-width="2.2" ${l.dash?'stroke-dasharray="5 4"':''}/>`+(last?`<circle cx="${x(last[1])}" cy="${y(last[0])}" r="3.5" fill="${l.color}"><title>${esc(l.name)}: ${fN1(last[0])}</title></circle>`:''); }).join('');

}

function vMensal(){

  }

  for(const r of KROWS){ if(!r){ body+='<tr class="sep"><td colspan="99"></td></tr>'; continue; } const [k,l,fm]=r, isC=COUNTK.has(k);
    const v= isC||k==='tkm'? `<span class="${sgn(TA[k]-TC[k])}">${fV(TC[k]?TA[k]/TC[k]-1:NaN)}</span>` : `<span class="${sgn(TA[k]-TC[k])}">${fPP(TA[k]-TC[k])}</span>`;
    const mt=meta?meta[k]:null; const pm=mt==null?'—':(isC||k==='tkm'?`<span class="${proj[k]/mt>=1?'pos':'neg'}">${fP(proj[k]/mt,0)}</span>`:`<span class="${proj[k]-mt>=0?'pos':'neg'}">${fPP(proj[k]-mt)}</span>`);
    body+=`<tr><th class="stk">${l}</th><td>${fm(TC[k])}</td><td class="cur">${fm(TA[k])}</td><td>${v}</td><td>${fm(proj[k])}</td><td>${mt==null?'—':fm(mt)}</td><td>${pm}</td><td class="gap"></td>${HA.map(a=>`<td${isC?heat(a[k],mx[k]):''}>${fm(a[k])}</td>`).join('')}</tr>`; }
  if(meta) body+=`<tr><th class="stk sub">Meta de vendas por hora</th><td></td><td class="cur"></td><td></td><td></td><td>${fN1(meta.vendas/horas)}</td><td></td><td class="gap"></td>${HOURS.map(()=>`<td>${fN1(meta.vendas/horas)}</td>`).join('')}</tr>`;
  body+='<tr class="sep"><td colspan="99"></td></tr>';
  for(const c of SHARE_CLASSES) body+=`<tr><th class="stk">${c==='SEM CLASSE'?'<span class="neg">Sem classe</span>':cap(c)}</th><td>${fP(TC.share(c))}</td><td class="cur">${fP(TA.share(c))}</td><td>${fPP(TA.share(c)-TC.share(c))}</td><td></td><td></td><td></td><td class="gap"></td>${HA.map(a=>`<td>${fP(a.share(c),0)}</td>`).join('')}</tr>`;
  body+=`<tr><th class="stk">TMA</th><td>${fT(TC.tma)}</td><td class="cur">${fT(TA.tma)}</td><td>${fV(TC.tma?TA.tma/TC.tma-1:NaN)}</td><td></td><td></td><td></td><td class="gap"></td>${HA.map(a=>`<td>${fT(a.tma)}</td>`).join('')}</tr>`;
  // comparação + variação

  const rowC=(l,fn,tot,fm=fN,cl='')=>`<tr><th class="stk ${cl}">${l}</th><td>${tot}</td><td class="gap"></td>${HOURS.map((h,i)=>`<td>${fn(i)}</td>`).join('')}</tr>`;
  const dlt=v=>`<span class="${sgn(v)}">${v>0?'+':''}${NF0.format(v)}</span>`;
  let b2='<tr class="band"><td colspan="99">Dia de comparação — '+fDF(C)+'</td></tr>';
  for(const [k,l,fm] of [['alo','Interações',fN],['cpc','CPC',fN],['tgt','Target',fN],['vtab','Vendas tabuladas',fN],['vendas','Vendas',fN],['mesp','MESP',fR],['efet','% Efetivo',fP],['target','% Target',fP]]) b2+=rowC(l,i=>fm(HC[i][k]),fm(TC[k]));
  b2+='<tr class="band"><td colspan="99">Variação — análise menos comparação</td></tr>';
  for(const [k,l] of [['alo','Δ Interações'],['cpc','Δ CPC'],['tgt','Δ Target'],['vtab','Δ Vendas tabuladas'],['vendas','Δ Vendas']]) b2+=rowC(l,i=>dlt(HA[i][k]-HC[i][k]),dlt(TA[k]-TC[k]));
  b2+='<tr class="band"><td colspan="99">Acumulado por hora</td></tr>';
  let s1=0,s2=0; const ia=HA.map(a=>s1+=a.alo), ic=HC.map(a=>s2+=a.alo);
  b2+=rowC('Interações acum. '+fD(A),i=>fN(ia[i]),fN(TA.alo))+rowC('Interações acum. '+fD(C),i=>fN(ic[i]),fN(TC.alo))
     +rowC('Vendas acum. '+fD(A),i=>fN(acA[i]),fN(TA.vendas))+rowC('Vendas acum. '+fD(C),i=>fN(acC[i]),fN(TC.vendas))+rowC('Δ vendas acum.',i=>dlt(acA[i]-acC[i]),dlt(TA.vendas-TC.vendas))
     +(meta?rowC('Meta de vendas acum.',i=>fN1(meta.vendas/horas*(i+1)),fN1(meta.vendas),fN,'sub'):'');
  // últimos 10 dias

  const LA=L.map(d=>agg(B,X,{from:d,to:d,canal}));
  const mxL=Math.max(...LA.map(a=>a.alo)), mxV=Math.max(...LA.map(a=>a.vendas));
  const h3=`<tr><th class="stk">Data</th><th>Interações</th><th>CPC</th><th>Target</th><th>Vendas tab.</th><th>Vendas</th><th>MESP</th><th>% Efetivo</th><th>% Target</th><th>% Conv. int.</th><th>% Conv. CPC</th><th>TMA</th></tr>`;
  const b3=L.map((d,i)=>{ const a=LA[i]; return `<tr class="${d===C?'hl':''}${d===A?' hla':''}"><th class="stk">${fD(d)} <small>${DOW[weekday(d)]}</small></th><td${heat(a.alo,mxL)}>${fN(a.alo)}</td><td>${fN(a.cpc)}</td><td>${fN(a.tgt)}</td><td>${fN(a.vtab)}</td><td${heat(a.vendas,mxV)}>${fN(a.vendas)}</td><td>${fR(a.mesp)}</td><td>${fP(a.efet)}</td><td>${fP(a.target)}</td><td>${fP(a.convI)}</td><td>${fP(a.convC)}</td><td>${fT(a.tma)}</td></tr>`; }).join('');
  return t+`<div class="two">${section('Interações por hora',ch)}${section('Vendas tabuladas acumuladas',ch2)}</div>`
    +section('Dia de análise por hora — '+fDF(A)+' x '+fDF(C),tbl(hd,body,'kpi'),'<span class="hint">Meta do dia: se a análise for hoje, usa a meta ajustada (o que falta ÷ D.U restantes).</span>')
    +section('Comparação e acumulado',tbl(hd2,b2,'kpi'))
    +section('Últimos 10 dias',tbl(h3,b3,'kpi'),'<span class="hint">Linha marcada = dia de comparação.</span>');
}

function activeOps(){ return B.bd.filter(b=>norm(b.status)==='ATIVO'); }
function perfilOf(b){ if(!b.inicio) return 'Veterano'; const d=(parseISO(ui.ref)-parseISO(b.inicio))/86400000; return d<(cfg.perfil.dias||90)?'Novato':'Veterano'; }
function vAgentes(){
  const ms=ui.mes, me=monthEnd(ms), canal=ui.canal, du=duInfo(ms,ui.ref), f=du.dec?du.mes/du.dec:0;
  const ops=activeOps();
  const P=cfg.perfil;
  let rows=ops.map(b=>{ const a=agg(B,X,{from:ms,to:me,canal,op:b.nome}); const pf=perfilOf(b); const mMesp=pf==='Novato'?P.nov:P.vet; const mV=mMesp/(P.tkm||1);
    const pV=a.vendas*f, pM=a.mesp*f, at=mMesp?pM/mMesp:0;
    return {b,a,pf,mMesp,mV,pV,pM,atV:mV?pV/mV:0,at,q:at>0.95?'Q1':at>=0.75?'Q2':at>=0.5?'Q3':'Q4',conv:a.alo?Math.min(1,a.vendas/a.alo):0}; });
  const SK={nome:r=>r.b.nome,alo:r=>r.a.alo,cpc:r=>r.a.cpc,efet:r=>r.a.efet,vtab:r=>r.a.vtab,vendas:r=>r.a.vendas,atV:r=>r.atV,mesp:r=>r.a.mesp,at:r=>r.at,tkm:r=>r.a.tkm,conv:r=>r.conv,tgt:r=>r.a.tgt,target:r=>r.a.target};
  if(ui.agSort && SK[ui.agSort]){ const g=SK[ui.agSort]; rows.sort((x,y)=>ui.agSort==='nome'?String(g(x)).localeCompare(g(y)):g(y)-g(x)); }
  const tot=agg(B,X,{from:ms,to:me,canal});
  const sum=k=>rows.reduce((s,r)=>s+r.a[k],0);
  const qs=['Q1','Q2','Q3','Q4'].map(q=>{ const rr=rows.filter(r=>r.q===q); const v=rr.reduce((s,r)=>s+r.a.vendas,0), i=rr.reduce((s,r)=>s+r.a.alo,0), m=rr.reduce((s,r)=>s+r.a.mesp,0); return {q,n:rr.length,v,i,m,c:i?v/i:0}; });
  const th=(k,l)=>`<th class="sort ${ui.agSort===k?'on':''}" data-sort="${k}">${l}</th>`;
  const hd=`<tr><th class="stk sort ${ui.agSort==='nome'?'on':''}" data-sort="nome">Operador</th><th>Perfil</th>${th('alo','Interações')}${th('cpc','CPC')}${th('tgt','Target')}${th('efet','% Efetivo')}${th('target','% Target')}${th('vtab','Vendas tab.')}${th('vendas','Vendas')}<th>Meta vendas</th><th>Proj. vendas</th>${th('atV','% Ating.')}${th('mesp','MESP')}<th>Meta MESP</th><th>Proj. MESP</th>${th('at','% Ating. MESP')}${th('tkm','TKM')}${th('conv','% Conv.')}<th>Quartil</th></tr>`;
  const mxA=Math.max(...rows.map(r=>r.a.alo)), mxV=Math.max(...rows.map(r=>r.a.vendas));
  let body=rows.map(r=>`<tr><th class="stk"><span class="opn">${esc(r.b.nome)}</span><small>${esc(r.b.mat)} · ${esc(r.b.turno)}</small></th><td><span class="chip ${r.pf==='Novato'?'nov':''}">${r.pf}</span></td><td${heat(r.a.alo,mxA)}>${fN(r.a.alo)}</td><td>${fN(r.a.cpc)}</td><td>${fN(r.a.tgt)}</td><td>${fP(r.a.efet)}</td><td>${fP(r.a.target)}</td><td>${fN(r.a.vtab)}</td><td${heat(r.a.vendas,mxV)}><b>${fN(r.a.vendas)}</b></td><td>${fN1(r.mV)}</td><td>${fN1(r.pV)}</td><td><span class="${r.atV>=1?'pos':'neg'}">${fP(r.atV,0)}</span></td><td>${fR(r.a.mesp)}</td><td>${fR(r.mMesp)}</td><td>${fR(r.pM)}</td><td><span class="bar"><i style="width:${Math.min(100,r.at*100)}%"></i></span>${fP(r.at,0)}</td><td>${fR2(r.a.tkm)}</td><td class="${r.conv<0.08?'neg':'pos'}">${fP(r.conv)}</td><td><span class="q ${r.q}">${r.q}</span></td></tr>`).join('');
  const sv=sum('vendas'),sa=sum('alo'),sm=sum('mesp');
  body+=`<tr class="tot"><th class="stk">Total operadores do BD</th><td></td><td>${fN(sa)}</td><td>${fN(sum('cpc'))}</td><td>${fN(sum('tgt'))}</td><td>${fP(sum('cpc')/(sa||1))}</td><td>${fP(sum('tgt')/(sum('cpc')||1))}</td><td>${fN(sum('vtab'))}</td><td>${fN(sv)}</td><td>${fN1(rows.reduce((s,r)=>s+r.mV,0))}</td><td>${fN1(sv*f)}</td><td></td><td>${fR(sm)}</td><td>${fR(rows.reduce((s,r)=>s+r.mMesp,0))}</td><td>${fR(sm*f)}</td><td></td><td>${fR2(sv?sm/sv:0)}</td><td>${fP(sa?sv/sa:0)}</td><td></td></tr>`;
  body+=`<tr class="sub2"><th class="stk">Fora do BD / outros</th><td></td><td>${fN(tot.alo-sa)}</td><td>${fN(tot.cpc-sum('cpc'))}</td><td>${fN(tot.tgt-sum('tgt'))}</td><td></td><td></td><td>${fN(tot.vtab-sum('vtab'))}</td><td title="Vendas Multicanal do mês menos as vendas dos operadores">${fN(tot.vendas-sv)}</td><td colspan="10"></td></tr>`;
  const qt=tbl(`<tr><th class="stk">Quartil</th><th>Faixa (% ating. MESP proj.)</th><th>Operadores</th><th>Interações</th><th>Vendas</th><th>% Conv.</th><th>MESP</th></tr>`,
    qs.map((x,i)=>`<tr><th class="stk"><span class="q ${x.q}">${x.q}</span></th><td>${['> 95%','75% a 95%','50% a 75%','< 50%'][i]}</td><td>${x.n}</td><td>${fN(x.i)}</td><td>${fN(x.v)}</td><td>${fP(x.c)}</td><td>${fR(x.m)}</td></tr>`).join(''),'kpi');
  return tiles([{l:'Operadores ativos no BD',v:ops.length,s:'Q1 '+qs[0].n+' · Q2 '+qs[1].n+' · Q3 '+qs[2].n+' · Q4 '+qs[3].n},{l:'Vendas dos operadores',v:fN(sv),s:'projeção '+fN(sv*f)},{l:'MESP dos operadores',v:fR(sm),s:'projeção '+fR(sm*f)},{l:'% Conv. (vendas/int.)',v:fP(sa?sv/sa:0),s:'TKM '+fR2(sv?sm/sv:0)}])
    +section('Performance por agente — '+fM(ms),tbl(hd,body,'kpi ag'),'<span class="hint">Lista = STATUS ATIVO no BD. Clique no título da coluna para ordenar. Meta por perfil (Novato &lt; '+(P.dias||90)+' dias de operação).</span>')
    +section('Quartis',qt);
}

function vAgentesHora(){
  const A=ui.dataA,C=ui.dataC,canal=ui.canal,mk=ui.agMetric;
  const ops=activeOps();
  const label={alo:'Interações',cpc:'CPC',tgt:'Target',vtab:'Vendas tabuladas',vendas:'Vendas'}[mk];
  const mat=ops.map(b=>({b,h:HOURS.map(h=>agg(B,X,{from:A,to:A,canal,hour:h,op:b.nome})),tA:agg(B,X,{from:A,to:A,canal,op:b.nome}),tC:agg(B,X,{from:C,to:C,canal,op:b.nome})}));
  const mx=Math.max(1,...mat.flatMap(r=>r.h.map(a=>a[mk])));
  const hd=`<tr><th class="stk">Operador</th><th class="cur">${fD(A)}</th><th>${fD(C)}</th><th>Δ</th><th>Int.</th><th>Vendas</th><th>% Efetivo</th><th class="gap"></th>${HOURS.map(h=>`<th>${HLABEL(h)}</th>`).join('')}</tr>`;
  let body=mat.map(r=>{ const d=r.tA[mk]-r.tC[mk]; return `<tr><th class="stk"><span class="opn">${esc(r.b.nome)}</span><small>${esc(r.b.turno)}</small></th><td class="cur"><b>${fN(r.tA[mk])}</b></td><td>${fN(r.tC[mk])}</td><td class="${sgn(d)}">${d>0?'+':''}${fN(d)}</td><td>${fN(r.tA.alo)}</td><td>${fN(r.tA.vendas)}</td><td>${fP(r.tA.efet)}</td><td class="gap"></td>${r.h.map(a=>`<td${heat(a[mk],mx)}>${a[mk]?fN(a[mk]):'<span class="z">·</span>'}</td>`).join('')}</tr>`; }).join('');
  const s=(i,k)=>mat.reduce((x,r)=>x+r.h[i][k],0), st=(k,w)=>mat.reduce((x,r)=>x+r[w][k],0);
  const T=agg(B,X,{from:A,to:A,canal}), TC=agg(B,X,{from:C,to:C,canal});
  body+=`<tr class="tot"><th class="stk">Total operadores do BD</th><td class="cur">${fN(st(mk,'tA'))}</td><td>${fN(st(mk,'tC'))}</td><td>${fN(st(mk,'tA')-st(mk,'tC'))}</td><td>${fN(st('alo','tA'))}</td><td>${fN(st('vendas','tA'))}</td><td></td><td class="gap"></td>${HOURS.map((h,i)=>`<td>${fN(s(i,mk))}</td>`).join('')}</tr>`;
  body+=`<tr class="sub2"><th class="stk">Total geral (inclui fora do BD)</th><td class="cur">${fN(T[mk])}</td><td>${fN(TC[mk])}</td><td></td><td>${fN(T.alo)}</td><td>${fN(T.vendas)}</td><td>${fP(T.efet)}</td><td class="gap"></td>${HOURS.map(h=>'<td></td>').join('')}</tr>`;
  const sel=`<label class="inl">Indicador <select id="agMetric">${[['alo','Interações'],['cpc','CPC'],['tgt','Target'],['vtab','Vendas tabuladas'],['vendas','Vendas']].map(([k,l])=>`<option value="${k}" ${k===mk?'selected':''}>${l}</option>`).join('')}</select></label>`;
  return section(label+' por agente e hora — '+fDF(A),tbl(hd,body,'kpi ag'),sel)

function vTabulacoes(){
  const canal=ui.canal, mode=ui.tabMode, cls=ui.tabCls;
  let periods,mainAgg,cmpAgg,plab,title;
  if(mode==='mes'){ const ms=ui.mes; const days=monthDays(ms); periods=days.map(d=>({l:fD(d),s:DOW[weekday(d)],a:agg(B,X,{from:d,to:d,canal})})); mainAgg=agg(B,X,{from:ms,to:monthEnd(ms),canal}); const pm=addMonths(ms,-1); cmpAgg=agg(B,X,{from:pm,to:monthEnd(pm),canal}); plab=[fM(ms),fM(pm)]; title='por dia — '+fM(ms); }
  else { const A=ui.dataA,C=ui.dataC; periods=HOURS.map(h=>({l:HLABEL(h),s:'',a:agg(B,X,{from:A,to:A,canal,hour:h})})); mainAgg=agg(B,X,{from:A,to:A,canal}); cmpAgg=agg(B,X,{from:C,to:C,canal}); plab=[fD(A),fD(C)]; title='por hora — '+fDF(A); }
  const tot=a=>SHARE_CLASSES.reduce((s,c)=>s+(a.cls[c]||0),0);
  const hd=`<tr><th class="stk">Classe</th><th class="cur">${plab[0]}</th><th>% </th><th>${plab[1]}</th><th>%</th><th class="gap"></th>${periods.map(p=>`<th>${p.l}${p.s?`<small>${p.s}</small>`:''}</th>`).join('')}</tr>`;
  const mxc=Math.max(1,...periods.flatMap(p=>SHARE_CLASSES.map(c=>p.a.cls[c]||0)));
  let body=SHARE_CLASSES.map(c=>{ const v=mainAgg.cls[c]||0, w=cmpAgg.cls[c]||0; return `<tr><th class="stk">${c==='SEM CLASSE'?'<span class="neg">SEM CLASSE</span>':c}</th><td class="cur"><b>${fN(v)}</b></td><td>${fP(v/(tot(mainAgg)||1))}</td><td>${fN(w)}</td><td>${fP(w/(tot(cmpAgg)||1))}</td><td class="gap"></td>${periods.map(p=>`<td${heat(p.a.cls[c],mxc)}>${fN(p.a.cls[c]||0)}</td>`).join('')}</tr>`; }).join('');
  body+=`<tr class="tot"><th class="stk">Total</th><td class="cur">${fN(tot(mainAgg))}</td><td></td><td>${fN(tot(cmpAgg))}</td><td></td><td class="gap"></td>${periods.map(p=>`<td>${fN(tot(p.a))}</td>`).join('')}</tr>`;
  const clsOf=k=>{ const r=cfg.tree.find(t=>norm(t.t)===norm(k)); return r?r.c:'SEM CLASSE'; };
  let keys=Object.entries(mainAgg.keys).filter(([k])=>k!=='SEM AGENTE'&&clsOf(k)!=='DISCADOR AUTOMÁTICO').filter(([k])=>cls==='TODAS'||clsOf(k)===cls).sort((a,b)=>b[1]-a[1]);
  const mxk=Math.max(1,...periods.flatMap(p=>keys.map(([k])=>p.a.keys[k]||0)));
  const totM=tot(mainAgg)||1;
  const kh=`<tr><th class="stk">Tabulação</th><th>Classe</th><th class="cur">${plab[0]}</th><th>% total</th><th>${plab[1]}</th><th>Var.</th><th class="gap"></th>${periods.map(p=>`<th>${p.l}</th>`).join('')}</tr>`;
  let kb=keys.map(([k,v])=>{ const w=cmpAgg.keys[k]||0, c=clsOf(k); return `<tr><th class="stk tabn">${esc(k)}</th><td><span class="chip c-${norm(c).replace(/\s/g,'-')}">${esc(c)}</span></td><td class="cur"><b>${fN(v)}</b></td><td>${fP(v/totM)}</td><td>${fN(w)}</td><td class="${sgn(v-w)}">${fV(w?v/w-1:NaN)}</td><td class="gap"></td>${periods.map(p=>`<td${heat(p.a.keys[k],mxk)}>${p.a.keys[k]?fN(p.a.keys[k]):'<span class="z">·</span>'}</td>`).join('')}</tr>`; }).join('');
  if(!keys.length) kb='<tr><td colspan="99" class="empty">Sem tabulações nesse filtro.</td></tr>';
  const ctl=`<div class="seg" role="group"><button class="${mode==='mes'?'on':''}" data-tabmode="mes">Mês por dia</button><button class="${mode==='dia'?'on':''}" data-tabmode="dia">Dia por hora</button></div>`;
  const sel=`<label class="inl">Classe <select id="tabCls"><option ${cls==='TODAS'?'selected':''}>TODAS</option>${SHARE_CLASSES.map(c=>`<option ${c===cls?'selected':''}>${c}</option>`).join('')}</select></label>`;
  const sc=X.found.semClasse.size;
  return (sc?`<div class="alert">Há <b>${sc}</b> tabulação(ões) sem classe na base. <a href="#arvore">Classificar na árvore</a></div>`:'')
    +section('Classes '+title,tbl(hd,body,'kpi'),ctl)
    +section('Tabulações '+title,tbl(kh,kb,'kpi'),sel+'<span class="hint">Tabulação = última tabulação feita pelo operador na interação.</span>');
}

function vMeta(){
  const ms=ui.mes, me=monthEnd(ms), ref=ui.ref, m=metaOf(ms), du=duInfo(ms,ref);
  if(!m) return `<div class="alert">Não há meta cadastrada para ${fM(ms)}. <a href="#dados">Cadastrar meta</a></div>`;
  const real=salesRange(ms,addDays(ref,-1)), hoje=(ref>=ms&&ref<=me)?salesRange(ref,ref):{v:0,m:0};
  const pesoHoje=(ref>=ms&&ref<=me)?CAL.du(ref):0;
  const L=(meta,r,rh)=>{ const porDU=meta/du.mes, mtd=porDU*du.dec, falta=Math.max(0,meta-r), nec=du.rest?falta/du.rest:0, proj=du.dec?r/du.dec*du.mes:0;
    return {meta,du:du.mes,dec:du.dec,rest:du.rest,porDU,mtd,r,at:mtd?r/mtd:0,gap:r-mtd,falta,nec,hojeM:nec*pesoHoje,rh,proj,pm:meta?proj/meta:0}; };
  const V=L(m.vendas,real.v,hoje.v), M=L(m.mesp,real.m,hoje.m);
  const rows=[['Meta do mês','meta',fN,fR],['D.U do mês','du',fN1,fN1],['D.U decorridos (até ontem)','dec',fN1,fN1],['D.U restantes (com hoje)','rest',fN1,fN1],['Meta por D.U (original)','porDU',fN1,fR],['Meta acumulada até ontem','mtd',fN1,fR],['Realizado até ontem','r',fN,fR],['% Atingimento (vs meta acumulada)','at',fP,fP],['Gap acumulado','gap',fN1,fR],['Falta para a meta','falta',fN,fR],['Necessário por D.U restante','nec',fN1,fR,'key'],['Meta de hoje (ajustada pelo peso do dia)','hojeM',fN1,fR,'key'],['Realizado hoje','rh',fN,fR],['Projeção de fechamento','proj',fN,fR],['Projeção x Meta','pm',fP,fP]];
  const sb=rows.map(([l,k,f1,f2,c])=>{ const cl=(k==='at'||k==='pm')?(V[k]>=1?'pos':'neg'):(k==='gap'?(V[k]<0?'neg':'pos'):''); const cl2=(k==='at'||k==='pm')?(M[k]>=1?'pos':'neg'):(k==='gap'?(M[k]<0?'neg':'pos'):''); return `<tr class="${c||''}"><th class="stk">${l}</th><td class="${cl}">${f1(V[k])}</td><td class="${cl2}">${f2(M[k])}</td></tr>`; }).join('');
  const days=daysBetween(ms,me);
  let am=0,ar=0,amM=0,arM=0; const cumMeta=[],cumReal=[],cumAdj=[];
  let adjAcc=null;
  const db=days.map(d=>{ const p=CAL.du(d), md=V.porDU*p, mdM=M.porDU*p; am+=md; amM+=mdM; const past=d<ref, isT=d===ref;
    const sd=(d<=ref)?salesRange(d,d):null; if(sd){ ar+=sd.v; arM+=sd.m; }
    const adj=d>=ref?V.nec*p:null, adjM=d>=ref?M.nec*p:null;
    cumMeta.push(am); cumReal.push(d<=ref?ar:null);
    if(d>=ref){ if(adjAcc==null) adjAcc=real.v; adjAcc+=adj; cumAdj.push(adjAcc);} else cumAdj.push(d===addDays(ref,-1)?real.v:null);
    const fer=CAL.feriado(d);
    return `<tr class="${isT?'hla':''}"><th class="stk">${fD(d)} <small>${DOW[weekday(d)]}${fer?' · '+esc(fer):''}</small></th><td>${fN1(p)}</td><td>${fN1(md)}</td><td>${fN1(am)}</td><td>${sd?fN(sd.v):''}</td><td>${sd?fN(ar):''}</td><td class="${sd?sgn(ar-am):''}">${sd?fN1(ar-am):''}</td><td class="adj">${adj==null?'':fN1(adj)}</td><td>${fR(mdM)}</td><td>${sd?fR(sd.m):''}</td><td>${sd?fR(arM):''}</td><td class="${sd?sgn(arM-amM):''}">${sd?fR(arM-amM):''}</td><td class="adj">${adjM==null?'':fR(adjM)}</td></tr>`; }).join('');
  const dh=`<tr><th class="stk">Data</th><th>D.U</th><th>Meta dia</th><th>Meta acum.</th><th>Vendas</th><th>Vendas acum.</th><th>Gap acum.</th><th>Meta ajustada</th><th>Meta MESP dia</th><th>MESP</th><th>MESP acum.</th><th>Gap MESP</th><th>MESP ajustada</th></tr>`;
  const ch=chartLines(days.map(fD),[{name:'Meta acumulada',values:cumMeta,color:css('--muted-bar'),dash:true},{name:'Realizado acumulado',values:cumReal,color:css('--accent')},{name:'Caminho para bater a meta',values:cumAdj,color:css('--good'),dash:true}]);
  return tiles([{l:'Necessário por D.U restante',v:fN1(V.nec)+' vendas',s:fR(M.nec)+' de MESP',cls:'hero'},{l:'Meta de hoje (ajustada)',v:fN1(V.hojeM),s:'peso do dia '+fN1(pesoHoje)+' · realizado hoje '+fN(hoje.v)},{l:'Realizado até ontem',v:fN(V.r)+' / '+fN(V.meta),s:`<b class="${V.at>=1?'pos':'neg'}">${fP(V.at,0)}</b> da meta acumulada`},{l:'Projeção de fechamento',v:fN(V.proj),s:`<b class="${V.pm>=1?'pos':'neg'}">${fP(V.pm,0)}</b> da meta`}])
    +`<div class="two">${section('Resumo — '+fM(ms),tbl('<tr><th class="stk">Indicador</th><th>Vendas</th><th>MESP</th></tr>',sb,'kpi'),'<span class="hint">Referência: '+fDF(ref)+'</span>')}${section('Acumulado do mês',ch)}</div>`
    +section('Dia a dia',tbl(dh,db,'kpi'),'<span class="hint">Meta ajustada = quanto vender em cada dia restante para fechar a meta, considerando o já realizado. Sábado = 0,5 D.U.</span>');
}

async function exportHtml(){
  const dl=window.claude&&window.claude.use? await window.claude.use('downloads').catch(()=>null) : null;
  if(!dl){ toast('Baixar arquivo só funciona com o painel aberto no Claude.',true); return; }
  const now=new Date();
  const snap={file:true,at:now.toISOString(),cfg:JSON.parse(JSON.stringify(cfg)),info:INFO,bases:{}};
  for(const k of ['inter','vend','hxh','bd']) snap.bases[k]=encodeBase(k,B[k]);
  const J=o=>JSON.stringify(o).replace(/<\//g,'<\\/');
  const shell=JSON.parse($('#page-shell').textContent);
  const code=$('#app-code').textContent;
  const html='<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+shell
   +'\n<script type="application/json" id="page-shell">'+J(shell)+'<\/script>'
   +'\n<script type="application/json" id="sample-data">'+J({inter:{s:[],r:[]},vend:[],bd:[],period:''})+'<\/script>'
   +'\n<script type="application/json" id="default-data">'+J({hist:DEF.hist,tree:[]})+'<\/script>'
   +'\n<script type="application/json" id="snapshot-data">'+J(snap)+'<\/script>'
   +'\n<script id="app-code">'+code+'<\/script>\n</body></html>';
  const name='index.html';
  try{ await dl.save({filename:name,data:new Blob([html],{type:'text/html'})}); toast('Arquivo gerado: '+name); }
  catch(e){ if(e&&e.code!=='declined') toast('Não consegui gerar o arquivo ('+(e&&e.code||'erro')+').',true); }

let pubArm=0;
async function publishAll(btn){
  if(Date.now()-pubArm>6000){ pubArm=Date.now(); btn.textContent='Confirmar: publicar agora'; btn.classList.add('arm'); setTimeout(()=>{ if(Date.now()-pubArm>=5900){ btn.textContent='Publicar para todos'; btn.classList.remove('arm'); } },6000); return; }
  pubArm=0;
  const art=window.claude&&window.claude.use? await window.claude.use('artifact').catch(()=>null):null;
  if(!art){ toast('Publicar só funciona com o painel aberto no Claude, por quem pode editar.',true); return; }
  if(INFO.inter.sample){ toast('Carregue a base de interações antes de publicar.',true); return; }
  btn.disabled=true; btn.textContent='Publicando…';
  try{
    const snap={pub:true,at:new Date().toISOString(),cfg:JSON.parse(JSON.stringify(cfg)),info:INFO,bases:{}};
    for(const k of ['inter','vend','hxh','bd']) snap.bases[k]=encodeBase(k,B[k]);
    const J=o=>JSON.stringify(o).replace(/<\//g,'<\\/');
    const shell=JSON.parse($('#page-shell').textContent);
    const raw=id=>document.getElementById(id).textContent;
    const code=$('#app-code').textContent;
    const html='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'
      +shell+'\n<script type="application/json" id="page-shell">'+J(shell)+'<\/script>'
      +'\n<script type="application/json" id="sample-data">'+raw('sample-data')+'<\/script>'
      +'\n<script type="application/json" id="default-data">'+raw('default-data')+'<\/script>'
      +'\n<script type="application/json" id="snapshot-data">'+J(snap)+'<\/script>'
      +'\n<script id="app-code">'+code+'<\/script>\n</body></html>';
    if(html.length>15.5e6) throw {code:'grande',message:'As bases passam do tamanho máximo do painel (16 MB). Carregue um período menor de interações.'};
    await art.publish(html);
    toast('Publicado. Quem abrir o link já vê os números novos.');
  }catch(e){
    const m={conflict:'Outra pessoa publicou ao mesmo tempo. O painel vai recarregar; publique de novo.',not_writer:'Você não tem acesso de edição para publicar.',not_granted:'Você não tem acesso de edição para publicar.',capability_disabled:'A publicação não está disponível nesta visualização. Abra o painel no claude.ai.'}[e&&e.code];
    toast(m||(e&&e.message)||'Não consegui publicar.',true); btn.disabled=false; btn.textContent='Publicar para todos'; btn.classList.remove('arm');
  }
}

/* ---------- render ---------- */
function render(){
  const v=ui.view;
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  $('#ttl').textContent=VIEWS.find(x=>x[0]===v)[1];
  const need={mensal:['mes','canal'],'mensal-hora':['canal','dataA','dataC'],agentes:['mes','canal'],'agentes-hora':['canal','dataA','dataC'],tabulacoes:[ui.tabMode==='mes'?'mes':'dataA',ui.tabMode==='mes'?null:'dataC','canal'],meta:['mes','ref'],arvore:[],dados:[],filtros:[]}[v];
  for(const k of ['mes','canal','dataA','dataC','ref']) $('#ctl-'+k).hidden=!need.includes(k);
  $('#f-mes').value=ui.mes.slice(0,7); $('#f-canal').value=ui.canal; $('#f-dataA').value=ui.dataA; $('#f-dataC').value=ui.dataC; $('#f-ref').value=ui.ref;
  setBanner();
  const fn={mensal:vMensal,'mensal-hora':vMensalHora,agentes:vAgentes,'agentes-hora':vAgentesHora,tabulacoes:vTabulacoes,meta:vMeta,arvore:vArvore,dados:vDados,filtros:vFiltros}[v];
  try{ $('#view').innerHTML=fn(); }catch(e){ console.error(e); $('#view').innerHTML='<div class="alert">Erro ao montar esta visão: '+esc(e.message)+'</div>'; }
  const sc=X.found.semClasse.size; const b=$('#badge-arv'); if(b){ b.hidden=!sc; b.textContent=sc; }
}
let toastT; function toast(msg,bad){ const t=$('#toast'); t.textContent=msg; t.className='toast show'+(bad?' bad':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',3800); }
function go(){ const h=location.hash.slice(1); ui.view=VIEWS.some(x=>x[0]===h)?h:'mensal'; render(); window.scrollTo(0,0); }

/* ---------- eventos ---------- */
document.addEventListener('change',async e=>{
  const t=e.target, id=t.id;
  if(id==='f-mes'&&t.value){ ui.mes=t.value+'-01'; render(); }
  else if(id==='f-canal'){ ui.canal=t.value; render(); }
  else if(id==='f-dataA'&&t.value){ ui.dataA=t.value; render(); }
  else if(id==='f-dataC'&&t.value){ ui.dataC=t.value; render(); }
  else if(id==='f-ref'&&t.value){ ui.ref=t.value; render(); }
  else if(id==='clsSel'){ ui.clsSel=t.value; render(); }
  else if(id==='agMetric'){ ui.agMetric=t.value; render(); }
  else if(id==='tabCls'){ ui.tabCls=t.value; render(); }
  else if(id==='treeCls'){ ui.treeCls=t.value; render(); }
  else if(t.dataset.file){ const k=t.dataset.file, f=t.files[0]; if(!f) return; const card=t.closest('.up'); const mode=card.querySelector('[data-mode].on')?.dataset.mode.split(':')[1]||'rep'; card.classList.add('busy');
    try{ await loadFile(k,f,mode==='add'?'add':'rep'); }catch(err){ toast(err.message||'Não consegui ler o arquivo.',true); render(); } }
  else if(t.dataset.tf!==undefined){ const r=treeDraft[+t.dataset.ti], f=t.dataset.tf; r[f]= t.type==='checkbox'?(t.checked?1:0):t.value; dirty.arvore=true; if(f!=='t') render(); }
  else if(t.dataset.mf!==undefined){ const m=cfgDraft.metas[+t.dataset.mi], f=t.dataset.mf; m[f]= f==='mes'?t.value+'-01':(f==='nota'?t.value:parseFloat(t.value)||0); dirty.metas=true; render(); }
  else if(id&&(id.startsWith('tx-')||id.startsWith('pf-'))){ const v=parseFloat(t.value)||0; const [g,k]=id.split('-'); if(g==='tx') cfgDraft.taxas[k]=v/100; else cfgDraft.perfil[k]=v; dirty.metas=true; }
  else if(t.dataset.fila!==undefined){ const f=cfgDraft.filas.find(x=>x.f===t.dataset.fila); if(f) f.on=t.checked; dirty.filtros=true; t.closest('.fila').classList.toggle('on',t.checked); }
  else if(id==='f-modo'){ cfgDraft.modo=t.value; dirty.filtros=true; }
  else if(id==='f-excl'||id==='f-adic'){ cfgDraft[id==='f-excl'?'excluidos':'adicionais']=t.value.split('\n').map(s=>s.trim()).filter(Boolean); dirty.filtros=true; }
  else if(id==='f-dep'){ cfgDraft.deptos=t.value.split(',').map(s=>s.trim()).filter(Boolean); dirty.filtros=true; }
  else if(id==='f-horas'){ cfgDraft.horas=parseInt(t.value)||14; dirty.filtros=true; }
  else if(id==='f-fer'){ cfgDraft.feriados=t.value.split('\n').map(l=>{ const m=l.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s*(.*)$/); return m?{d:m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]),n:m[4]||'Feriado'}:null; }).filter(Boolean); dirty.filtros=true; }
  else if(t.dataset.af!==undefined){ cfgDraft.alias[+t.dataset.ai][t.dataset.af]=t.value; dirty.filtros=true; }
});
document.addEventListener('input',e=>{ if(e.target.id==='treeQ'){ ui.treeQ=e.target.value; clearTimeout(window._tq); window._tq=setTimeout(()=>{ const p=e.target.selectionStart; render(); const el=$('#treeQ'); if(el){ el.focus(); el.setSelectionRange(p,p);} },250);} });
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,th.sort'); if(!t) return;
  if(t.dataset.sort){ ui.agSort=ui.agSort===t.dataset.sort?null:t.dataset.sort; render(); return; }
  if(t.dataset.tabmode){ ui.tabMode=t.dataset.tabmode; render(); return; }
  if(t.dataset.mode){ t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t)); return; }
  if(t.dataset.clear){ await clearBase(t.dataset.clear); return; }
  if(t.dataset.addsc!==undefined){ const sc=[...X.found.semClasse.entries()].sort((a,b)=>b[1]-a[1]); const [k]=sc[+t.dataset.addsc]; const c=$('#scc-'+t.dataset.addsc).value; const fl={TELEFONIA:[1,0,0,0],RECUSA:[1,1,1,0],'FORA TARGET':[1,1,0,0],AGENDAMENTO:[1,1,1,0],SUCESSO:[1,1,1,1],'NÃO TABULADO':[1,0,0,0],'DISCADOR AUTOMÁTICO':[0,0,0,0]}[c];
    if(!treeDraft) treeDraft=JSON.parse(JSON.stringify(cfg.tree)); treeDraft.push({t:k,c,a:fl[0],p:fl[1],g:fl[2],v:fl[3],o:'Nova - adicionada no painel'}); cfg.tree=JSON.parse(JSON.stringify(treeDraft)); dirty.arvore=false; recompute(); render(); await saveDoc('arvore'); return; }
  if(t.dataset.tdel!==undefined){ treeDraft.splice(+t.dataset.tdel,1); dirty.arvore=true; render(); return; }
  if(t.id==='treeAdd'){ treeDraft.unshift({t:'',c:'RECUSA',a:1,p:1,g:1,v:0,o:'Nova - adicionada no painel'}); dirty.arvore=true; ui.treeQ=''; ui.treeCls=''; render(); $('.tabcell input')?.focus(); return; }
  if(t.id==='treeUndo'){ treeDraft=null; dirty.arvore=false; render(); return; }
  if(t.id==='treeSave'){ document.activeElement?.blur(); cfg.tree=treeDraft.filter(r=>String(r.t).trim()).map(r=>({...r,t:String(r.t).trim()})); treeDraft=null; dirty.arvore=false; recompute(); render(); await saveDoc('arvore'); return; }
  if(t.id==='pubBtn'){ await publishAll(t); return; }
  if(t.id==='exportHtml'){ t.disabled=true; await exportHtml(); t.disabled=false; return; }
  if(t.id==='metaAdd'){ const last=cfgDraft.metas.map(m=>m.mes).sort().pop()||monthStart(todayISO); cfgDraft.metas.push({mes:addMonths(last,1),vendas:0,mesp:0,nota:''}); dirty.metas=true; render(); return; }
  if(t.dataset.mdel!==undefined){ cfgDraft.metas.splice(+t.dataset.mdel,1); dirty.metas=true; render(); return; }
  if(t.id==='metaSave'){ cfg.metas=cfgDraft.metas.slice().sort((a,b)=>a.mes<b.mes?-1:1); cfg.taxas=cfgDraft.taxas; cfg.perfil=cfgDraft.perfil; cfgDraft=null; dirty.metas=false; render(); await saveDoc('metas'); return; }
  if(t.id==='aliasAdd'){ cfgDraft.alias.push({de:'',para:''}); dirty.filtros=true; render(); return; }
  if(t.dataset.adel!==undefined){ cfgDraft.alias.splice(+t.dataset.adel,1); dirty.filtros=true; render(); return; }
  if(t.dataset.alias){ cfgDraft.alias.push({de:t.dataset.alias,para:''}); dirty.filtros=true; render(); toast('Escolha o nome correspondente no BD e salve.'); return; }
  if(t.id==='filUndo'){ cfgDraft=null; dirty.filtros=false; render(); return; }
  if(t.id==='filSave'){ document.activeElement?.blur(); const F=cfgDraft; for(const k of ['filas','excluidos','modo','adicionais','alias','deptos','horas']) cfg[k]=F[k]; cfg.alias=cfg.alias.filter(a=>a.de&&a.para); const ferChanged=JSON.stringify(cfg.feriados)!==JSON.stringify(F.feriados); cfg.feriados=F.feriados; cfgDraft=null; dirty.filtros=false; recompute(); render(); const ok=await saveDoc('filtros'); if(ok&&ferChanged) await saveDoc('calendario'); return; }
});
['dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>{ const d=e.target.closest&&e.target.closest('.drop'); if(!d) return; e.preventDefault(); if(ev==='drop'&&e.dataTransfer.files[0]){ const inp=d.querySelector('input'); const dt=new DataTransfer(); dt.items.add(e.dataTransfer.files[0]); inp.files=dt.files; inp.dispatchEvent(new Event('change',{bubbles:true})); } }));
window.addEventListener('hashchange',go);

/* ---------- início ---------- */
(async function start(){
  $('#f-canal').innerHTML=CANAIS.map(c=>`<option>${c}</option>`).join('');
  if(SNAP){ loadSnap(); ui.ref=READONLY? isoDate(new Date(SNAP.at)) : todayISO; }
  renderNav(); recompute(); initDates(true); go();
  if(READONLY){ $('#sync').textContent='Versão para divulgação'; return; }
  const hasClaude=!!(window.claude&&window.claude.use);
  if(!hasClaude){ await new Promise(r=>setTimeout(r,800)); }
  if(!(window.claude&&window.claude.use)){ await setEditor(); initDb(); return; } // arquivo aberto fora do Claude: modo local
  initDb();
})();

</script>
